<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <title>Sistema RPG — Entrar</title>
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card">
      <div class="brand">
        <div class="logo">🎲</div>
        <h1>Sistema RPG</h1>
        <p class="muted small">Mesas online com call por ambiente</p>
      </div>

      <div class="tabs">
        <button type="button" id="tab-login" class="active">Entrar</button>
        <button type="button" id="tab-register">Criar conta</button>
      </div>

      <form id="login-form" onsubmit="return false">
        <label for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>
        <label for="login-password">Senha</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary">Entrar</button>
        <div class="error" id="login-error"></div>
      </form>

      <form id="register-form" class="hidden" onsubmit="return false">
        <label>Eu sou</label>
        <div class="role-picker">
          <input type="radio" name="role" id="role-mestre" value="mestre">
          <label for="role-mestre"><span>🧙</span>Mestre</label>
          <input type="radio" name="role" id="role-jogador" value="jogador" checked>
          <label for="role-jogador"><span>🗡️</span>Jogador</label>
        </div>
        <label for="reg-display">Nome exibido</label>
        <input id="reg-display" name="displayName" maxlength="40" required placeholder="Como os outros vão te ver">
        <label for="reg-email">E-mail</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" required>
        <label for="reg-password">Senha</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password" required minlength="6">
        <button type="submit" class="primary">Criar conta</button>
        <div class="error" id="register-error"></div>
        <div class="notice hidden" id="register-notice"></div>
      </form>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
