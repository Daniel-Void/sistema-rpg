<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <title>Painel — Sistema RPG</title>
</head>
<body>
  <header class="topbar">
    <div class="left">
      <a class="brand" href="/painel"><i data-logo></i><span>Sistema RPG</span></a>
    </div>
    <div class="right">
      <span id="who" class="small"></span>
      <span id="role-tag" class="tag"></span>
      <button id="logout" class="sm quiet" title="Sair"><i data-icon="logout" data-size="16"></i>Sair</button>
    </div>
  </header>

  <main class="page">
    <div class="grid-2">
      <section class="panel" id="create-card">
        <p class="eyebrow">Mestre</p>
        <h2>Nova sala</h2>
        <form id="create-form" onsubmit="return false">
          <label for="room-name">Nome da sala</label>
          <input id="room-name" maxlength="60" required placeholder="A Maldição de Strahd">
          <label for="room-desc">Descrição <span class="muted">(opcional)</span></label>
          <textarea id="room-desc" rows="2" maxlength="500"></textarea>
          <button type="submit" class="primary" style="margin-top:1rem">Criar sala</button>
          <div class="error" id="create-error"></div>
          <p class="hint" style="margin-top:0.5rem">A sala e tudo dentro dela (ambientes, rolagens, músicas e arquivos) é excluída 8 horas depois de criada.</p>
        </form>
      </section>
      <section class="panel">
        <p class="eyebrow">Convite</p>
        <h2>Entrar em uma sala</h2>
        <p class="muted small">Use o código de 6 letras que o mestre passou.</p>
        <form id="join-form" onsubmit="return false">
          <label for="join-code">Código</label>
          <input id="join-code" class="mono" maxlength="16" required placeholder="K7M2QX" style="text-transform:uppercase;letter-spacing:0.12em">
          <button type="submit" class="primary" style="margin-top:1rem">Entrar</button>
          <div class="error" id="join-error"></div>
        </form>
      </section>
    </div>

    <div class="page-head" style="margin-top:2.5rem">
      <h2 style="margin:0">Minhas salas</h2>
    </div>
    <div id="rooms" class="room-list"></div>
  </main>
  <script type="module" src="/js/painel.js"></script>
</body>
</html>
